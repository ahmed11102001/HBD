<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد حبيبتي</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap" rel="stylesheet">
    <style>
        body {
            margin: 0;
            padding: 0;
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 99%, #fecfef 100%);
            height: 100vh;
            overflow: hidden;
            font-family: 'Cairo', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* كارت المعايدة في المنتصف */
        .greeting-card {
            background: rgba(255, 255, 255, 0.85);
            padding: 40px 60px;
            border-radius: 30px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            text-align: center;
            z-index: 10;
            backdrop-filter: blur(10px);
            border: 2px solid rgba(255, 255, 255, 0.5);
            animation: popIn 1.5s cubic-bezier(0.68, -0.55, 0.265, 1.55) forwards;
            opacity: 0;
            transform: scale(0.8);
        }

        h1 {
            color: #ff4b72;
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.05);
        }

        p {
            color: #555;
            font-size: 1.5rem;
            line-height: 1.6;
        }

        .candles {
            font-size: 3rem;
            margin-top: 20px;
            animation: pulse 2s infinite;
        }

        /* الأنيميشن الخاص بالكارت */
        @keyframes popIn {
            100% {
                opacity: 1;
                transform: scale(1);
            }
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.1); }
            100% { transform: scale(1); }
        }

        /* العناصر اللي بتطير من تحت لفوق */
        .floating-item {
            position: absolute;
            bottom: -10vh;
            font-size: 2.5rem;
            animation: floatUp linear forwards;
            z-index: 1;
            user-select: none;
            pointer-events: none;
        }

        @keyframes floatUp {
            0% {
                transform: translateY(0) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(-120vh) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }
    </style>
</head>
<body>

    <div class="greeting-card">
        <h1>كل سنة وأنتي أجمل حاجة في حياتي ❤️</h1>
        <p>كل سنة وأنتي طيبة يا حبيبتي،<br>ويارب دايماً ماليّة عليا دنيتي فرحة وسعادة.<br>بحبك جداً ✨</p>
        <div class="candles">🎂🕯️🎈</div>
    </div>

    <script>
        // الأشكال اللي هتطير في الخلفية (قلوب، بلالين، شمع، هدايا)
        const floatingItems = ['❤️', '💖', '🎈', '🎉', '🎁', '✨', '💕', '🎂', '🥳'];

        function createFloatingItem() {
            const item = document.createElement('div');
            item.classList.add('floating-item');
            
            // اختيار شكل عشوائي
            item.innerText = floatingItems[Math.floor(Math.random() * floatingItems.length)];
            
            // تحديد مكان عشوائي بالعرض
            item.style.left = Math.random() * 100 + 'vw';
            
            // تحديد سرعة عشوائية (من 4 إلى 8 ثواني عشان تطلع لفوق)
            const duration = Math.random() * 4 + 4;
            item.style.animationDuration = duration + 's';
            
            // تحديد حجم عشوائي
            item.style.fontSize = (Math.random() * 2 + 1.5) + 'rem';

            document.body.appendChild(item);

            // مسح العنصر بعد ما يخلص الأنيميشن عشان مياكلش من رامات المتصفح
            setTimeout(() => {
                item.remove();
            }, duration * 1000);
        }

        // إنشاء عنصر جديد كل 300 جزء من الثانية
        setInterval(createFloatingItem, 300);
    </script>

</body>
</html>
