<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عيد ميلاد سعيد حبيبتي!</title>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Cairo', sans-serif;
            background: linear-gradient(135deg, #1a0a2e 0%, #4a1a6b 30%, #d63384 70%, #ff6b9d 100%);
            min-height: 100vh;
            overflow: hidden;
            position: relative;
        }

        /* Hearts Background - Full Screen */
        .heart-bg {
            position: fixed;
            font-size: 30px;
            animation: heartFloat linear infinite;
            z-index: 1;
            pointer-events: none;
            filter: drop-shadow(0 0 10px rgba(255, 105, 180, 0.5));
        }

        @keyframes heartFloat {
            0% {
                transform: translateY(100vh) rotate(0deg) scale(0.3);
                opacity: 0;
            }
            10% {
                opacity: 0.8;
            }
            90% {
                opacity: 0.8;
            }
            100% {
                transform: translateY(-100px) rotate(720deg) scale(1.5);
                opacity: 0;
            }
        }

        /* Hearts from sides */
        .heart-side {
            position: fixed;
            font-size: 25px;
            animation: heartSide linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes heartSide {
            0% {
                transform: translateX(-100px) rotate(0deg) scale(0.5);
                opacity: 0;
            }
            10% {
                opacity: 0.9;
            }
            90% {
                opacity: 0.9;
            }
            100% {
                transform: translateX(100vw) rotate(360deg) scale(1.2);
                opacity: 0;
            }
        }

        /* Hearts diagonal */
        .heart-diag {
            position: fixed;
            font-size: 20px;
            animation: heartDiag linear infinite;
            z-index: 1;
            pointer-events: none;
        }

        @keyframes heartDiag {
            0% {
                transform: translate(-100px, 100vh) rotate(0deg) scale(0.4);
                opacity: 0;
            }
            15% {
                opacity: 0.9;
            }
            85% {
                opacity: 0.9;
            }
            100% {
                transform: translate(100vw, -100px) rotate(540deg) scale(1.3);
                opacity: 0;
            }
        }

        /* Pulsing hearts in background */
        .heart-pulse {
            position: fixed;
            font-size: 40px;
            animation: heartPulse ease-in-out infinite;
            z-index: 0;
            pointer-events: none;
            opacity: 0.3;
        }

        @keyframes heartPulse {
            0%, 100% {
                transform: scale(0.8);
                opacity: 0.2;
            }
            50% {
                transform: scale(1.3);
                opacity: 0.5;
            }
        }

        /* Main Container */
        .container {
            position: relative;
            z-index: 10;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
        }

        /* Candle */
        .candle-container {
            position: relative;
            margin-bottom: 30px;
            animation: bounceIn 1.5s ease-out;
        }

        @keyframes bounceIn {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.2);
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }

        .candle {
            width: 60px;
            height: 120px;
            background: linear-gradient(90deg, #ff9a9e 0%, #fecfef 50%, #ff9a9e 100%);
            border-radius: 10px 10px 5px 5px;
            position: relative;
            margin: 0 auto;
            box-shadow: 0 5px 20px rgba(255, 105, 180, 0.4);
        }

        .candle::before {
            content: '';
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 8px;
            height: 15px;
            background: #333;
            border-radius: 2px;
        }

        .flame {
            position: absolute;
            top: -50px;
            left: 50%;
            transform: translateX(-50%);
            width: 30px;
            height: 45px;
            background: radial-gradient(ellipse at bottom, #ffeb3b 0%, #ff9800 40%, #f44336 70%, transparent 100%);
            border-radius: 50% 50% 50% 50% / 60% 60% 40% 40%;
            animation: flicker 0.1s ease-in-out infinite alternate;
            box-shadow: 0 0 30px #ff9800, 0 0 60px #ff5722, 0 0 90px rgba(255, 87, 34, 0.5);
        }

        @keyframes flicker {
            0% {
                transform: translateX(-50%) scale(1) rotate(-2deg);
                opacity: 1;
            }
            100% {
                transform: translateX(-50%) scale(1.05) rotate(2deg);
                opacity: 0.9;
            }
        }

        /* Cake */
        .cake {
            font-size: 100px;
            margin: 20px 0;
            animation: cakeAppear 2s ease-out 0.5s both;
            filter: drop-shadow(0 10px 30px rgba(255, 105, 180, 0.5));
        }

        @keyframes cakeAppear {
            0% {
                transform: scale(0) rotate(-180deg);
                opacity: 0;
            }
            60% {
                transform: scale(1.2) rotate(10deg);
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        /* Title */
        .title {
            font-size: clamp(2rem, 8vw, 5rem);
            font-weight: 900;
            color: #fff;
            text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 105, 180, 0.5), 0 0 60px rgba(255, 105, 180, 0.3);
            margin-bottom: 10px;
            animation: titleGlow 2s ease-in-out infinite alternate, slideIn 1.5s ease-out;
        }

        @keyframes titleGlow {
            0% {
                text-shadow: 0 0 20px rgba(255, 105, 180, 0.8), 0 0 40px rgba(255, 105, 180, 0.5), 0 0 60px rgba(255, 105, 180, 0.3);
            }
            100% {
                text-shadow: 0 0 30px rgba(255, 105, 180, 1), 0 0 60px rgba(255, 105, 180, 0.8), 0 0 90px rgba(255, 105, 180, 0.5);
            }
        }

        @keyframes slideIn {
            0% {
                transform: translateY(-50px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Subtitle */
        .subtitle {
            font-size: clamp(1.2rem, 4vw, 2.5rem);
            color: #ffd700;
            font-weight: 700;
            margin-bottom: 30px;
            animation: fadeInUp 1.5s ease-out 0.3s both;
            text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        @keyframes fadeInUp {
            0% {
                transform: translateY(30px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Wishes Card */
        .wishes-card {
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(15px);
            border-radius: 25px;
            padding: 30px;
            max-width: 600px;
            width: 90%;
            border: 2px solid rgba(255, 105, 180, 0.3);
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3), inset 0 0 30px rgba(255, 105, 180, 0.1);
            animation: cardAppear 1.5s ease-out 0.8s both;
            margin-bottom: 30px;
        }

        @keyframes cardAppear {
            0% {
                transform: scale(0.8) rotate(-5deg);
                opacity: 0;
            }
            100% {
                transform: scale(1) rotate(0deg);
                opacity: 1;
            }
        }

        .wishes-text {
            font-size: clamp(1.1rem, 3vw, 1.6rem);
            color: #fff;
            line-height: 2.2;
            font-weight: 400;
            text-align: center;
        }

        .wishes-text .line {
            display: block;
            margin-bottom: 8px;
            opacity: 0;
            animation: lineAppear 0.8s ease-out forwards;
        }

        @keyframes lineAppear {
            0% {
                transform: translateY(20px);
                opacity: 0;
            }
            100% {
                transform: translateY(0);
                opacity: 1;
            }
        }

        /* Sparkle Button */
        .sparkle-btn {
            background: linear-gradient(45deg, #ff6b9d, #c44569, #f8b500);
            background-size: 200% 200%;
            color: white;
            border: none;
            padding: 15px 40px;
            font-size: 1.3rem;
            font-family: 'Cairo', sans-serif;
            font-weight: 700;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            animation: gradientShift 3s ease infinite, pulse 2s ease-in-out infinite;
            transition: transform 0.3s, box-shadow 0.3s;
            margin-top: 20px;
            position: relative;
            overflow: hidden;
        }

        .sparkle-btn:hover {
            transform: translateY(-3px) scale(1.05);
            box-shadow: 0 15px 40px rgba(255, 107, 157, 0.6);
        }

        .sparkle-btn:active {
            transform: translateY(0) scale(0.98);
        }

        @keyframes gradientShift {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        @keyframes pulse {
            0%, 100% {
                box-shadow: 0 10px 30px rgba(255, 107, 157, 0.4);
            }
            50% {
                box-shadow: 0 10px 40px rgba(255, 107, 157, 0.7), 0 0 60px rgba(255, 107, 157, 0.3);
            }
        }

        /* Fireworks Canvas */
        #fireworks {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 5;
        }

        /* Responsive */
        @media (max-width: 480px) {
            .candle {
                width: 40px;
                height: 80px;
            }
            .flame {
                width: 20px;
                height: 30px;
                top: -35px;
            }
            .cake {
                font-size: 70px;
            }
        }
    </style>
<base target="_blank">
</head>
<body>
    <!-- Fireworks Canvas -->
    <canvas id="fireworks"></canvas>

    <!-- Main Content -->
    <div class="container">
        <div class="candle-container">
            <div class="candle">
                <div class="flame"></div>
            </div>
        </div>

        <div class="cake">🎂</div>

        <h1 class="title">عيد ميلاد سعيد!</h1>
        <p class="subtitle">🎉 كل سنة وانتي طيبة يا حبيبتي 🎉</p>

        <div class="wishes-card">
            <div class="wishes-text" id="wishesText">
                <span class="line">في يوم زي ده، ربنا جابك للدنيا وجملها بيكي! 🌟</span>
                <span class="line">كل سنة وانتي اجمل حاجة حصلتلي في حياتي 💖</span>
                <span class="line">ربنا يخليكي ليا ويديم فرحتك ويحققلك كل احلامك 🙏</span>
                <span class="line">انتي نور عيني وسر سعادتي وكل حاجة حلوة في دنيتي ✨</span>
                <span class="line">عقبال 100 سنة من الفرحة والحب معاكي يا روحي! 💕</span>
            </div>
        </div>

        <button class="sparkle-btn" onclick="celebrate()">🎊 اضغطي هنا يا حبيبتي! 🎊</button>
    </div>

    <script>
        // Heart emojis array with colors
        const heartEmojis = ['❤️', '💕', '💖', '💗', '💓', '💝', '💘', '❣️', '💟', '💌', '🩷', '🧡', '💛', '💚', '💙', '💜', '🤎', '🖤', '🩶', '🤍'];
        const heartColors = ['#ff6b9d', '#ff4757', '#ff6348', '#ff9ff3', '#f368e0', '#ff9f43', '#feca57', '#ff6b6b', '#ee5a24', '#f368e0', '#00d2d3', '#5f27cd'];

        // Create floating hearts from bottom
        function createHeart() {
            const heart = document.createElement('div');
            heart.className = 'heart-bg';
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.animationDuration = (Math.random() * 4 + 5) + 's';
            heart.style.fontSize = (Math.random() * 30 + 20) + 'px';
            heart.style.filter = `drop-shadow(0 0 15px ${heartColors[Math.floor(Math.random() * heartColors.length)]})`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 9000);
        }

        // Create hearts from sides
        function createHeartSide() {
            const heart = document.createElement('div');
            heart.className = 'heart-side';
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.top = Math.random() * 100 + 'vh';
            heart.style.animationDuration = (Math.random() * 5 + 6) + 's';
            heart.style.fontSize = (Math.random() * 25 + 15) + 'px';
            heart.style.filter = `drop-shadow(0 0 10px ${heartColors[Math.floor(Math.random() * heartColors.length)]})`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 11000);
        }

        // Create diagonal hearts
        function createHeartDiag() {
            const heart = document.createElement('div');
            heart.className = 'heart-diag';
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.animationDuration = (Math.random() * 6 + 7) + 's';
            heart.style.fontSize = (Math.random() * 20 + 15) + 'px';
            heart.style.filter = `drop-shadow(0 0 12px ${heartColors[Math.floor(Math.random() * heartColors.length)]})`;
            document.body.appendChild(heart);
            setTimeout(() => heart.remove(), 13000);
        }

        // Create pulsing background hearts
        function createHeartPulse() {
            const heart = document.createElement('div');
            heart.className = 'heart-pulse';
            heart.innerHTML = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
            heart.style.left = Math.random() * 100 + 'vw';
            heart.style.top = Math.random() * 100 + 'vh';
            heart.style.animationDuration = (Math.random() * 3 + 2) + 's';
            heart.style.animationDelay = Math.random() * 2 + 's';
            heart.style.fontSize = (Math.random() * 50 + 30) + 'px';
            document.body.appendChild(heart);
        }

        // Initialize hearts
        function initHearts() {
            // Background pulsing hearts
            for (let i = 0; i < 30; i++) {
                createHeartPulse();
            }

            // Continuous floating hearts
            setInterval(createHeart, 150);
            setInterval(createHeartSide, 400);
            setInterval(createHeartDiag, 600);

            // Initial burst
            for (let i = 0; i < 50; i++) {
                setTimeout(createHeart, i * 50);
            }
        }

        // Fireworks Canvas
        const canvas = document.getElementById('fireworks');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        let particles = [];

        class Particle {
            constructor(x, y, color) {
                this.x = x;
                this.y = y;
                this.color = color;
                const angle = Math.random() * Math.PI * 2;
                const velocity = Math.random() * 6 + 2;
                this.vx = Math.cos(angle) * velocity;
                this.vy = Math.sin(angle) * velocity;
                this.life = 100;
                this.decay = Math.random() * 2 + 1;
                this.size = Math.random() * 4 + 2;
            }

            update() {
                this.x += this.vx;
                this.y += this.vy;
                this.vy += 0.1;
                this.life -= this.decay;
                this.size *= 0.98;
            }

            draw() {
                ctx.globalAlpha = this.life / 100;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
                ctx.fill();
                ctx.globalAlpha = 1;
            }
        }

        function createFirework(x, y) {
            const colors = ['#ff6b9d', '#ffd700', '#ff4757', '#2ed573', '#1e90ff', '#ff6348', '#da70d6', '#fff', '#ff1493', '#ff9ff3'];
            for (let i = 0; i < 60; i++) {
                particles.push(new Particle(x, y, colors[Math.floor(Math.random() * colors.length)]));
            }
        }

        function animateFireworks() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.08)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            particles = particles.filter(p => p.life > 0);
            particles.forEach(p => {
                p.update();
                p.draw();
            });

            requestAnimationFrame(animateFireworks);
        }

        animateFireworks();

        // Auto fireworks
        setInterval(() => {
            createFirework(Math.random() * canvas.width, Math.random() * canvas.height * 0.5);
        }, 2500);

        // Celebrate function
        function celebrate() {
            // Massive heart explosion
            for (let i = 0; i < 100; i++) {
                setTimeout(() => {
                    createHeart();
                    if (i % 3 === 0) createHeartSide();
                    if (i % 5 === 0) createHeartDiag();
                }, i * 20);
            }

            // Fireworks burst
            for (let i = 0; i < 8; i++) {
                setTimeout(() => {
                    createFirework(
                        Math.random() * canvas.width * 0.8 + canvas.width * 0.1,
                        Math.random() * canvas.height * 0.4 + canvas.height * 0.1
                    );
                }, i * 150);
            }

            // Show love message
            const btn = document.querySelector('.sparkle-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '💖 بحبك اوي يا حبيبتي! 💖';
            btn.style.background = 'linear-gradient(45deg, #ff1493, #ff6b9d, #ff1493)';
            btn.style.transform = 'scale(1.1)';

            setTimeout(() => {
                btn.innerHTML = originalText;
                btn.style.background = '';
                btn.style.transform = '';
            }, 3000);
        }

        // Resize handler
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Click anywhere for fireworks and hearts
        document.addEventListener('click', (e) => {
            if (e.target.tagName !== 'BUTTON') {
                createFirework(e.clientX, e.clientY);
                for (let i = 0; i < 5; i++) {
                    setTimeout(createHeart, i * 50);
                }
            }
        });

        // Animate wishes lines
        const lines = document.querySelectorAll('.wishes-text .line');
        lines.forEach((line, index) => {
            line.style.animationDelay = (2 + index * 0.6) + 's';
        });

        // Start everything
        initHearts();
    </script>
</body>
</html>
